<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --border-color: #d1d5db;
      --input-bg: #f9fafb;
      --primary-color: #2563eb;
      --note-color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1f2937;
        --text-color: #f3f4f6;
        --border-color: #374151;
        --input-bg: #111827;
        --primary-color: #3b82f6;
        --note-color: #9ca3af;
      }
    }

    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      font-size: 14px;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      box-sizing: border-box;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      background-color: var(--border-color);
      border-radius: 22px;
      transition: background-color 0.2s;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    input[type="checkbox"] {
      display: none;
    }

    input[type="checkbox"]:checked + .toggle-switch {
      background-color: var(--primary-color);
    }

    input[type="checkbox"]:checked + .toggle-switch::after {
      transform: translateX(18px);
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 8px;
    }

    textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .note-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .note {
      font-size: 10px;
      color: var(--note-color);
    }

    .important-note {
      font-size: 14px;
      color: var(--primary-color);
      text-align: center;
    }
  </style>
</head>
<body>
  <label class="toggle-container">
    <span class="section-title">Exclude Private IPs</span>
    <input type="checkbox" id="excludePrivate">
    <div class="toggle-switch"></div>
  </label>

  <label for="excludedSites" class="section-title">Excluded Sites</label>
  <textarea id="excludedSites" rows="6" placeholder="example.com&#10;mysite.org"></textarea>
  
  <div class="note-container">
    <span class="note">Enter one domain per line.</span>
    <span class="note">The extension can hide text that isn't an IP address, but looks like one.</span>
    <span class="important-note">Refresh page to apply changes!</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
